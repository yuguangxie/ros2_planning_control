# 样例车辆参数
#
# 该文件描述低速四轮 Ackermann 车辆的几何和执行器限制。
# 控制节点运行时主要读取 control_params.yaml 中的 vehicle 字段；
# 本文件用于 bringup/demo、文档说明和后续车辆 profile 管理。

vehicle:
  profile_id: "ackermann_demo_v1"
  supported_models: ["front_ackermann", "dual_ackermann"]
  default_model: "front_ackermann"

  # 几何参数，单位为 m。
  wheel_base_m: 1.2
  track_width_m: 0.8
  vehicle_length_m: 1.8
  vehicle_width_m: 0.9
  front_overhang_m: 0.3
  rear_overhang_m: 0.3

  # 速度和加速度限制，默认保持低速。
  max_speed_mps: 1.2
  max_accel_mps2: 0.5
  max_decel_mps2: 0.8

  # 前后轮转角和转角速度限制。
  max_front_steer_rad: 0.6
  max_rear_steer_rad: 0.6
  max_front_steer_rate_radps: 0.5
  max_rear_steer_rate_radps: 0.5

  # 双 Ackermann 反相后轮转向比例：
  # tan(delta_rear) = -rear_steer_ratio * tan(delta_front)
  rear_steer_ratio: 0.5
