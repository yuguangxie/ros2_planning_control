# low_speed_av_control default parameters.
# Internal control algorithms keep SI units. The final SCU output layer converts
# speed to km/h and steering to degrees for the Yunle chassis driver.
low_speed_av_control:
  ros__parameters:
    output:
      # internal: publish only /control/command
      # scu_control_command: publish only Yunle SCU command
      # both: publish debug internal command and Yunle SCU command
      mode: "both"

    topics:
      localization_pose_topic: "/localization/pose"
      trajectory_topic: "/planning/trajectory"
      vehicle_state_topic: "/vehicle/state"
      safety_status_topic: "/safety/status"
      control_command_topic: "/control/command"
      scu_command_topic: "/yunle_chassis/control/scu_control_command"
      control_status_topic: "/control/status"

    controller:
      algorithm: "lqr"
      control_rate_hz: 50.0
      localization_timeout_s: 0.2
      trajectory_timeout_s: 0.5
      allowed_trajectory_statuses: ["ok"]
      trajectory_s_tolerance_m: 1.0e-4
      progress_backward_window_points: 3
      progress_forward_window_points: 200
      progress_max_heading_error_rad: 1.57

    control:
      status_publish_rate_hz: 5.0
      publish_deadline_warning_s: 0.1
      cadence_window_size: 128

    hardware_watchdog:
      timeout_s: 0.5
      contract_status: "DECLARED_NOT_HIL_VERIFIED"

    safety:
      estop_latched: true
      clear_speed_threshold_mps: 0.05

    vehicle_state:
      required: false
      timeout_s: 0.5

    vehicle:
      model: "front_ackermann"
      wheel_base_m: 1.2
      max_speed_mps: 1.2
      max_accel_mps2: 0.5
      max_decel_mps2: 0.8
      max_front_steer_rad: 0.6
      max_rear_steer_rad: 0.6
      max_front_steer_rate_radps: 0.5
      max_rear_steer_rate_radps: 0.5
      rear_steer_ratio: 0.5

    pure_pursuit:
      lookahead_min_m: 0.8
      lookahead_max_m: 3.0
      lookahead_speed_gain: 1.2

    stanley:
      k: 0.8
      epsilon_mps: 0.1
      max_correction_rad: 0.5

    lqr:
      q_lateral_error: 3.0
      q_heading_error: 2.0
      r_steering: 1.0
      max_iterations: 80
      convergence_eps: 1.0e-6
      min_speed_mps: 0.2
      preview_time_s: 0.2
      use_curvature_feedforward: true
      max_steering_angle_rad: 0.52

    mpc_sampler:
      horizon_steps: 10
      dt_s: 0.1
      curvature_samples: [-0.2, -0.1, 0.0, 0.1, 0.2]
      lateral_error_weight: 1.0
      heading_error_weight: 0.5
      speed_error_weight: 0.2
      steering_effort_weight: 0.05

    command_smoother:
      max_accel_mps2: 0.5
      max_decel_mps2: 0.8
      max_jerk_mps3: 2.0
      min_dt_s: 0.001
      max_dt_s: 0.1

    scu:
      max_steering_angle_deg: 27.0
      max_target_speed_kmh: 5.0
      front_steer_sign: 1.0
      rear_steer_sign: 1.0
      overrange_policy: "clamp"
      stop_shift_level: 1
      torque_or_speed_mode: 1
      steering_angle_speed_valid: false
      brake_force_command_valid: false
      lights:
        left: 0
        right: 0
        position: 0
        low_beam: 0
